name: Build APK

on:
  push:
    branches: [main]
  workflow_dispatch:

# Read-only by default; only the release step's job gets write access.
permissions:
  contents: read

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      - uses: gradle/actions/setup-gradle@v4

      # The signing key lives only in the repo's Actions secrets, never in the code.
      - name: Load signing key
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
        run: |
          if [ -n "$KEYSTORE_BASE64" ]; then
            echo "$KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/release.jks"
            echo "GLASSESLIVE_KEYSTORE_FILE=$RUNNER_TEMP/release.jks" >> "$GITHUB_ENV"
            echo "HAS_RELEASE_KEY=true" >> "$GITHUB_ENV"
          else
            echo "::warning::KEYSTORE_BASE64 secret not set - building with a throwaway debug key and skipping the release."
            echo "HAS_RELEASE_KEY=false" >> "$GITHUB_ENV"
          fi

      - name: Build APK
        env:
          GLASSESLIVE_KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          GLASSESLIVE_KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
        run: |
          chmod +x gradlew
          ./gradlew --no-daemon assembleRelease
          cp app/build/outputs/apk/release/app-release.apk GlassesLive.apk
          sha256sum GlassesLive.apk | tee GlassesLive.apk.sha256

      - name: Remove signing key
        if: always()
        run: rm -f "$RUNNER_TEMP/release.jks"

      - uses: actions/upload-artifact@v4
        with:
          name: GlassesLive-apk
          path: |
            GlassesLive.apk
            GlassesLive.apk.sha256

      # The latest APK is always at:
      # https://github.com/<owner>/<repo>/releases/latest/download/GlassesLive.apk
      - name: Publish release
        if: env.HAS_RELEASE_KEY == 'true' && github.ref == 'refs/heads/main'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: build-${{ github.run_number }}
          name: Glasses Live build ${{ github.run_number }}
          body: |
            Automatic build from ${{ github.sha }}.
            Install `GlassesLive.apk` on your Android phone. See the README for setup.
            SHA-256 is in `GlassesLive.apk.sha256`.
          files: |
            GlassesLive.apk
            GlassesLive.apk.sha256
          make_latest: true
